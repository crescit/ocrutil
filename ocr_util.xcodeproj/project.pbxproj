		0306D4E22EDA600000787CCD /* Sign paddleocr-cli */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
				"$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Resources/paddleocr-cli-dir/paddleocr-cli",
				"$(SRCROOT)/ocr_util/Helper.entitlements",
			);
			name = "Sign paddleocr-cli";
			outputFileListPaths = (
			);
			outputPaths = (
				"$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Contents/Resources/paddleocr-cli-dir/paddleocr-cli",
				"$(ARCHIVE_PRODUCTS_PATH)/Applications/$(PRODUCT_NAME).app/Contents/Resources/paddleocr-cli-dir/paddleocr-cli",
				"$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Contents/Resources/paddleocr-cli-dir/",
				"$(ARCHIVE_PRODUCTS_PATH)/Applications/$(PRODUCT_NAME).app/Contents/Resources/paddleocr-cli-dir/",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -e\n\nENTITLEMENTS=\"$SRCROOT/ocr_util/Helper.entitlements\"\n\n# Try multiple possible paths (regular build and archive)\nHELPER_BIN=\"\"\n\n# Try regular build path first\nif [ -n \"${TARGET_BUILD_DIR}\" ] && [ -n \"${CONTENTS_FOLDER_PATH}\" ]; then\n    HELPER_BIN=\"${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Contents/Resources/paddleocr-cli-dir/paddleocr-cli\"\nfi\n\n# Try archive path if regular path doesn't exist (ARCHIVE_PRODUCTS_PATH may be unset)\nif [ -z \"$HELPER_BIN\" ] || [ ! -f \"$HELPER_BIN\" ]; then\n    if [ -n \"${ARCHIVE_PRODUCTS_PATH:-}\" ] && [ -n \"${PRODUCT_NAME:-}\" ]; then\n        HELPER_BIN=\"${ARCHIVE_PRODUCTS_PATH}/Applications/${PRODUCT_NAME}.app/Contents/Resources/paddleocr-cli-dir/paddleocr-cli\"\n    fi\nfi\n\n# Try alternative build path\nif [ -z \"$HELPER_BIN\" ] || [ ! -f \"$HELPER_BIN\" ]; then\n    if [ -n \"${BUILT_PRODUCTS_DIR}\" ] && [ -n \"${UNLOCALIZED_RESOURCES_FOLDER_PATH}\" ]; then\n        HELPER_BIN=\"${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/paddleocr-cli-dir/paddleocr-cli\"\n    fi\nfi\n\n# Only sign if it exists (important for other configs)\nif [ -f \"$HELPER_BIN\" ]; then\n  echo \"Codesigning helper: $HELPER_BIN\"\n\n  # Use the signing identity Xcode is already using\n  SIGN_IDENTITY=\"${EXPANDED_CODE_SIGN_IDENTITY_NAME:-$CODE_SIGN_IDENTITY}\"\n  if [ -z \"$SIGN_IDENTITY\" ] || [ \"$SIGN_IDENTITY\" = \"-\" ]; then\n    SIGN_IDENTITY=\"${CODE_SIGN_IDENTITY}\"\n  fi\n\n  if [ -z \"$SIGN_IDENTITY\" ] || [ \"$SIGN_IDENTITY\" = \"-\" ]; then\n    echo \"warning: No code signing identity set, using ad-hoc signing\"\n    SIGN_IDENTITY=\"-\"\n  fi\n\n  echo \"  Using signing identity: $SIGN_IDENTITY\"\n  echo \"  Entitlements: $ENTITLEMENTS\"\n\n  # Sign the main executable with bundle identifier\n  # Note: We don't use --options runtime because PyInstaller's bootloader\n  # has issues loading Python3 with hardened runtime, even when Python3 is signed\n  # The --identifier is required for sandbox to get bundle identifier\n  /usr/bin/codesign \\\n    --force \\\n    --timestamp=none \\\n    --entitlements \"$ENTITLEMENTS\" \\\n    --identifier \"trabajomofeta.ocr-util.paddleocr-cli\" \\\n    --sign \"$SIGN_IDENTITY\" \\\n    \"$HELPER_BIN\"\n\n  # Verify entitlements were applied\n  echo \"  Verifying entitlements...\"\n  /usr/bin/codesign -d --entitlements - \"$HELPER_BIN\" 2>/dev/null | grep -q \"com.apple.security.app-sandbox\" && echo \"  ✓ Sandbox entitlement verified\" || echo \"  ⚠ Warning: Sandbox entitlement not found\"\n  echo \"✓ Successfully signed paddleocr-cli\"\n\n  # Sign Python3 and other executables in _internal directory\n  INTERNAL_DIR=\"$(dirname \"$HELPER_BIN\")/_internal\"\n  if [ -d \"$INTERNAL_DIR\" ]; then\n    echo \"Signing Python3 and libraries in _internal...\"\n    \n    # Sign Python3 executable\n    PYTHON3=\"$INTERNAL_DIR/Python3\"\n    if [ -f \"$PYTHON3\" ]; then\n      echo \"  Signing Python3...\"\n      /usr/bin/codesign \\\n        --force \\\n        --timestamp=none \\\n        --sign \"$SIGN_IDENTITY\" \\\n        \"$PYTHON3\" 2>/dev/null || echo \"  ⚠ Warning: Failed to sign Python3\"\n    fi\n    \n    # Sign all .dylib files in _internal (they may be unsigned)\n    find \"$INTERNAL_DIR\" -name \"*.dylib\" -type f | while read dylib; do\n      echo \"  Signing $(basename \"$dylib\")...\"\n      /usr/bin/codesign \\\n        --force \\\n        --timestamp=none \\\n        --sign \"$SIGN_IDENTITY\" \\\n        \"$dylib\" 2>/dev/null || true\n    done\n    \n    echo \"✓ Finished signing _internal files\"\n  fi\nelse\n  echo \"Helper binary not found. Tried:\"\n  echo \"  ${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Contents/Resources/paddleocr-cli-dir/paddleocr-cli\"\n  echo \"  ${ARCHIVE_PRODUCTS_PATH}/Applications/${PRODUCT_NAME}.app/Contents/Resources/paddleocr-cli-dir/paddleocr-cli\"\n  echo \"  ${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/paddleocr-cli-dir/paddleocr-cli\"\n  exit 0\nfi\n";
		};
/* End PBXShellScriptBuildPhase section */

